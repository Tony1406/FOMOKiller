# Override para desarrollo con hot reload.
# Uso: docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build

services:
  db:
    ports:
      - "${DB_PORT_HOST:-3307}:3306"

  server:
    build:
      context: ./Server
      dockerfile: Dockerfile.dev
    environment:
      NODE_ENV: development
      CLIENT_URL: ${CLIENT_URL:-http://localhost:5173}
    ports:
      - "3000:3000"
    volumes:
      - ./Server:/app
      - /app/node_modules
    command: npm run dev

  client:
    build:
      context: ./Client
      dockerfile: Dockerfile.dev
    environment:
      CHOKIDAR_USEPOLLING: "true"
      WATCHPACK_POLLING: "true"
      # Vite proxifica /api al contenedor server dentro de la red de docker
      VITE_API_PROXY: http://server:3000
    ports:
      - "${CLIENT_DEV_PORT:-5173}:5173"
    volumes:
      - ./Client:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0 --port 5173
