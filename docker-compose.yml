services:
  db:
    image: mysql:8.0
    container_name: fomokiller_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: fomokiller
      MYSQL_USER: fkuser
      MYSQL_PASSWORD: fkpass
    ports:
      - "3307:3306" # CAMBIO: Usamos 3307 en tu PC para evitar el error de puerto ocupado
    volumes:
      - db_data:/var/lib/mysql
      - ./db/init.sql:/docker-entrypoint-initdb.d/01_init.sql:ro

  server:
    build:
      context: ./Server
    container_name: fomokiller_server
    restart: always
    env_file:
      - ./Server/.env
    ports:
      - "3000:3000"
    depends_on:
      - db

  client:
    build:
      context: ./Client
    container_name: fomokiller_client
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - server

volumes:
  db_data:
