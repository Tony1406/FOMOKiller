################################################################################
#  nginx reverse proxy para FOMOKiller
#
#  Coloca este fichero en:  /etc/nginx/sites-available/fomokiller.conf
#  Activa con:              sudo ln -s /etc/nginx/sites-available/fomokiller.conf \
#                                       /etc/nginx/sites-enabled/
#  Comprueba sintaxis:      sudo nginx -t
#  Recarga:                 sudo systemctl reload nginx
#
#  Sustituye:
#    - fomokiller.tudominio.com  por tu dominio real
#    - las rutas de certificado por las tuyas (certbot las pone aqui por defecto)
#    - el puerto 8080 si cambiaste CLIENT_PORT en el .env
################################################################################


# ----- redireccion HTTP -> HTTPS -----
server {
    listen 80;
    listen [::]:80;
    server_name fomokiller.tudominio.com;

    # certbot pondra aqui el challenge cuando renueve cert
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}


# ----- sitio HTTPS -----
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name fomokiller.tudominio.com;

    # ---------- certificados (rutas tipicas de certbot) ----------
    ssl_certificate     /etc/letsencrypt/live/fomokiller.tudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fomokiller.tudominio.com/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/fomokiller.tudominio.com/chain.pem;

    # ---------- seguridad TLS ----------
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;
    ssl_stapling on;
    ssl_stapling_verify on;

    # ---------- cabeceras de seguridad ----------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---------- limites ----------
    client_max_body_size 10M;
    server_tokens off;

    # ---------- logs ----------
    access_log /var/log/nginx/fomokiller.access.log;
    error_log  /var/log/nginx/fomokiller.error.log warn;

    # ---------- proxy hacia el contenedor del cliente ----------
    # El cliente esta bindeado a 127.0.0.1:8080 (HOST_BIND=127.0.0.1 en .env)
    # y a su vez proxifica /api/ internamente hacia el server por la red de docker.
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;

        # websockets (por si en el futuro se anaden, ej. chat en tiempo real)
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout    60s;
        proxy_connect_timeout 10s;
        proxy_send_timeout    60s;
    }
}
